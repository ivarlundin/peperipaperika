<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Ivar Lundin — UX designer and musician (work in progress).">
  <title>Ivar Lundin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-home">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-bar">
    <a class="site-bar__mark" href="index.html">Ivar Lundin</a>
    <nav class="site-bar__nav" aria-label="Site">
      <a href="design.html">Design</a>
      <a href="music.html">Music</a>
      <a class="site-bar__contact" href="mailto:hello@ivarlundin.se">Contact</a>
    </nav>
  </header>

  <main id="main" class="home-main">
    <section class="name-stage" aria-labelledby="name-keyboard-label" data-reveal>
      <div class="name-stage__top">
        <p id="name-keyboard-label" class="name-stage__label">Your name is a keyboard</p>
        <button
          type="button"
          class="sound-toggle"
          id="btn-sound"
          aria-pressed="false"
        >
          Sound off
        </button>
      </div>

      <h1 class="name-keyboard" id="name-keyboard" data-reveal style="--reveal-delay: 80ms">
        <span class="name-keyboard__word">
          <button type="button" class="name-key" data-note="0" aria-label="Play note, letter I">I</button>
          <button type="button" class="name-key" data-note="1" aria-label="Play note, letter V">V</button>
          <button type="button" class="name-key" data-note="2" aria-label="Play note, letter A">A</button>
          <button type="button" class="name-key" data-note="3" aria-label="Play note, letter R">R</button>
        </span>
        <span class="name-keyboard__gap" aria-hidden="true"></span>
        <span class="name-keyboard__word">
          <button type="button" class="name-key" data-note="4" aria-label="Play note, letter L">L</button>
          <button type="button" class="name-key" data-note="5" aria-label="Play note, letter U">U</button>
          <button type="button" class="name-key" data-note="6" aria-label="Play note, letter N">N</button>
          <button type="button" class="name-key" data-note="7" aria-label="Play note, letter D">D</button>
          <button type="button" class="name-key" data-note="8" aria-label="Play note, letter I">I</button>
          <button type="button" class="name-key" data-note="9" aria-label="Play note, letter N">N</button>
        </span>
      </h1>

      <p class="name-stage__hint" id="name-hint">
        Hover, tap, or focus a letter and press <kbd>Enter</kbd>. Mash keys for a riff. Weight always moves; sound is optional.
      </p>
      <p role="status" class="visually-hidden" id="name-status" aria-live="polite"></p>
    </section>

    <header class="home-intro" data-reveal style="--reveal-delay: 160ms">
      <p class="home-intro__role" id="wght-role">
        <span class="role-caps">Senior UX</span><span class="role-plain"> Designer and musician based in Southern Sweden.</span>
      </p>
      <p class="home-intro__employer">
        Works at <a href="https://www.visma.com" target="_blank" rel="noopener noreferrer">Visma</a>.
      </p>
    </header>
  </main>

  <footer class="site-foot">
    <p>Hidden draft · <code>testing/portfolio/</code></p>
  </footer>

  <script src="js/site.js" defer></script>
  <script src="js/home.js" defer></script>
</body>
</html>
