        </p>
        <p role="status" class="visually-hidden" id="piano-status" aria-live="polite"></p>
      </div>
    </div>

    <div class="home-main">
      <header class="home-intro" data-reveal style="--reveal-delay: 160ms">
        <p class="home-intro__role" id="wght-role">
