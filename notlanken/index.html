<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Notlänken ™</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Trebuchet+MS:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="nl-skin">
  <main class="nl-shell">
    <header class="nl-header nl-site-brand">
      <a href="./" id="site-home" class="nl-brand-link">
        <h1>Notlänken ™</h1>
        <p class="sub">Där noter och drömmar möts</p>
      </a>
    </header>

    <section id="view-list" class="view nl-panel">
      <label class="song-search" for="song-filter">
        <span class="song-search-label">Sök låt</span>
        <input type="search" id="song-filter" placeholder="Filtrera titlar…" autocomplete="off" enterkeyhint="search">
      </label>
      <ul id="song-list" class="song-list" aria-label="Låtar"></ul>
    </section>

    <section id="player" class="view player nl-panel" hidden>
      <header class="topbar">
        <button type="button" id="btn-back" class="nl-btn nl-btn-pill nl-btn-topbar" aria-label="Tillbaka till låtlistan">← Låtar</button>
        <button type="button" id="btn-copy-link" class="nl-btn nl-btn-pill nl-btn-topbar" title="Kopiera länk till denna låt">Kopiera länk</button>
      </header>

      <div class="nl-lcd" aria-live="polite">
        <div class="nl-lcd-bezel">
          <div class="nl-lcd-screen">
            <p class="nl-lcd-title" id="lcd-title">Välj låt</p>
            <p class="chord-line nl-lcd-chord" id="chord-line" hidden></p>
            <div class="nl-lcd-metrics">
              <span id="time-barbeat">takt 1 slag 1</span>
              <span class="nl-lcd-sep">·</span>
              <span><span id="time-elapsed">0:00</span> / <span id="time-total">0:00</span></span>
            </div>
          </div>
        </div>
        <p class="now-playing visually-hidden" id="now-playing"></p>
      </div>

      <div class="scrub-block">
        <div class="lane-block">
          <div class="lane lane-glass" id="lane" aria-label="Rörlig tidslinje — dra vågrätt för att skrubba">
            <div class="lane-track" id="lane-track"></div>
            <canvas class="lane-roll" id="lane-roll" aria-hidden="true"></canvas>
            <div class="lane-pinned" id="lane-pinned" hidden></div>
          </div>
        </div>
      </div>

      <div class="player-transport-stack">
        <div class="progress-scrub">
          <span class="progress-time progress-elapsed" id="time-elapsed-dock">0:00</span>
          <div class="timeline overview timeline-glass timeline-dock" id="timeline" role="slider" aria-label="Tidslinje, dra för att hoppa" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="timeline-rail" id="timeline-rail">
              <div class="timeline-sections" id="timeline-sections"></div>
              <div class="timeline-notes" id="timeline-notes"></div>
              <div class="timeline-playhead" id="timeline-playhead"></div>
            </div>
          </div>
          <span class="progress-time progress-remaining" id="time-remaining">-0:00</span>
        </div>

        <div class="transport-block">
          <div class="transport transport-v2">
            <div class="transport-side transport-side-left">
              <button type="button" id="btn-speed" class="btn-round secondary btn-aux transport-aux" aria-haspopup="dialog" aria-controls="speed-dialog" aria-expanded="false" title="Uppspelningshastighet" aria-label="Hastighet">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10h-2A8 8 0 1 1 12 4V2zm1 5v5.25l4.5 2.67-.75 1.23L11 13V7h2z"/></svg>
              </button>
            </div>
            <div class="transport-center">
              <button type="button" id="btn-prev" class="transport-icon-btn" disabled aria-label="Föregående takt" title="Föregående takt">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6zm9.5 6L10 6v12l5.5-6z"/></svg>
              </button>
              <button type="button" id="btn-play-pause" class="btn-round btn-play-main" disabled aria-label="Spela" aria-pressed="false" title="Spela (mellanslag)">
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
              </button>
              <button type="button" id="btn-next" class="transport-icon-btn" disabled aria-label="Nästa takt" title="Nästa takt">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2V6z"/></svg>
              </button>
            </div>
            <div class="transport-side transport-side-right">
              <button type="button" id="btn-mixer" class="btn-round secondary btn-aux transport-aux" aria-haspopup="dialog" aria-controls="mixer-dialog" aria-expanded="false" title="Volym per spår och master" aria-label="Mixer — volym per spår och master">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V6h2v12H4zm7 0V3h2v15h-2zm7 0V9h2v9h-2z"/></svg>
              </button>
              <button type="button" id="btn-komp-quick" class="transport-komp-chip" hidden aria-label="Autokomp och stil" title="Autokomp">
                <span class="transport-komp-key" id="transport-komp-key">—</span>
                <span class="transport-komp-label">Komp</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <button type="button" id="btn-stop" class="visually-hidden" disabled aria-label="Stopp" tabindex="-1">Stopp</button>

      <div class="komp-bar nl-module" id="komp-bar" hidden>
        <div class="komp-toggle-row">
          <span class="komp-toggle-label" id="komp-toggle-label">Autokomp</span>
          <button type="button" id="komp-switch" class="nl-ios-switch" role="switch" aria-checked="true" aria-labelledby="komp-toggle-label"></button>
        </div>
        <div class="komp-style-picker" id="komp-style-picker" hidden>
          <select id="komp-style" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
          <button type="button" id="komp-style-trigger" class="nl-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="komp-style-list"></button>
          <ul id="komp-style-list" class="nl-select-menu" role="listbox" hidden></ul>
        </div>
      </div>

      <div class="notes-panel">
        <div class="notes-toolbar">
          <div class="note-add" id="note-add" role="group" aria-label="Ny anteckning vid aktuell position">
            <button type="button" data-type="bug" class="note-add-btn note-bug">+ Fel <kbd>B</kbd></button>
            <button type="button" data-type="onske" class="note-add-btn note-onske">+ Önskemål <kbd>Ö</kbd><kbd>W</kbd></button>
            <button type="button" data-type="note" class="note-add-btn note-note">+ Anteckning <kbd>N</kbd></button>
          </div>
          <div class="notes-actions">
            <button type="button" id="btn-copy-notes" class="ghost nl-btn">Kopiera till urklipp</button>
            <button type="button" id="btn-clear-notes" class="ghost danger nl-btn">Rensa</button>
          </div>
        </div>
        <ul id="notes-list" class="notes-list"></ul>
      </div>

      <p id="status" class="status visually-hidden" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="mixer-dialog" class="mixer-dialog nl-dialog">
    <div class="dialog-head">
      <p class="dialog-title">Mixer</p>
      <button type="button" id="mixer-close" class="nl-dialog-close" aria-label="Stäng">×</button>
    </div>
    <div id="mixer-panel" class="mixer-panel">
      <div class="mixer-strips mixer-strips-inline">
        <div id="mixer-groups" class="mixer-track-list"></div>
        <div class="mixer-track-row strip-aux" data-mixer-aux="reverb">
          <span class="mixer-track-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7h2v-7a7 7 0 0 1 14 0v7h2v-7a9 9 0 0 0-9-9zm-1 16h2v3h-2z"/></svg>
          </span>
          <div class="mixer-track-main">
            <span class="mixer-track-label">Reverb</span>
            <div class="fader fader-h">
              <input type="range" id="reverb" min="0" max="100" value="8" aria-label="Reverb, gemensam våt nivå">
              <span class="fader-bubble" id="reverb-bubble" hidden>8%</span>
            </div>
          </div>
          <span class="mixer-track-actions mixer-track-actions-spacer" aria-hidden="true"></span>
          <span class="strip-val mixer-track-val" id="reverb-val">8%</span>
        </div>
        <div class="mixer-track-row strip-aux strip-master" data-mixer-aux="master">
          <span class="mixer-track-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 18V6h2v12H4zm7 0V3h2v15h-2zm7 0V9h2v9h-2z"/></svg>
          </span>
          <div class="mixer-track-main">
            <span class="mixer-track-label">Master</span>
            <div class="fader fader-h">
              <input type="range" id="master-vol" min="0" max="100" value="72" aria-label="Master volym">
              <span class="fader-bubble" id="master-vol-bubble" hidden>72%</span>
            </div>
          </div>
          <span class="mixer-track-actions mixer-track-actions-spacer" aria-hidden="true"></span>
          <span class="strip-val mixer-track-val" id="master-vol-val">72%</span>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="speed-dialog" class="speed-dialog nl-dialog">
    <div class="dialog-head">
      <p class="dialog-title">Hastighet</p>
      <button type="button" id="speed-close" class="nl-dialog-close" aria-label="Stäng">×</button>
    </div>
    <div class="speed-options" id="speed-options"></div>
  </dialog>

  <dialog id="note-dialog" class="note-dialog nl-dialog">
    <form method="dialog" id="note-form">
      <p class="dialog-title" id="note-dialog-title">Ny anteckning</p>
      <p class="dialog-meta" id="note-dialog-meta"></p>
      <textarea id="note-text" rows="3" placeholder="Beskriv för arrangörsboten…" required></textarea>
      <div class="dialog-actions">
        <button type="button" id="note-cancel" class="secondary btn-round-sm">Avbryt</button>
        <button type="submit" value="save" class="btn-round-sm btn-ok">Spara</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="player.js"></script>
</body>
</html>
