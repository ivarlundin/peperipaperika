<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Notlåda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="view-list" class="view">
      <h1>Notlåda</h1>
      <p class="sub">Privat MIDI-spelare</p>
      <ul id="song-list" class="song-list" aria-label="Låtar"></ul>
    </section>

    <section id="player" class="view player" hidden>
      <header class="topbar">
        <button type="button" id="btn-back" class="ghost" aria-label="Tillbaka till låtlistan">← Låtar</button>
        <p class="now-playing" id="now-playing"></p>
        <button type="button" id="btn-mixer" class="ghost" aria-expanded="false" aria-controls="mixer-panel">Mixer</button>
      </header>

      <div id="mixer-panel" class="mixer-panel" hidden>
        <div class="mixer-strips">
          <div id="mixer-groups" class="mixer-groups"></div>
          <div class="strip strip-aux">
            <span class="strip-label">Reverb</span>
            <div class="fader">
              <input type="range" id="reverb" min="0" max="100" value="12" aria-label="Reverb, våt nivå">
            </div>
            <span class="strip-val" id="reverb-val">12%</span>
          </div>
          <div class="strip strip-aux strip-master">
            <span class="strip-label">Master</span>
            <div class="fader">
              <input type="range" id="master-vol" min="0" max="100" value="72" aria-label="Master volym">
            </div>
            <span class="strip-val" id="master-vol-val">72%</span>
          </div>
        </div>
      </div>

      <div class="komp-bar" id="komp-bar">
        <label class="komp-toggle">
          <input type="checkbox" id="komp-enabled" checked>
          <span>Komp</span>
        </label>
        <label class="komp-field">
          <span>Stil</span>
          <select id="komp-style" aria-label="Autokomp-stil"></select>
        </label>
        <div class="komp-variant" role="group" aria-label="Variant">
          <button type="button" class="chip" data-variant="auto" aria-pressed="true">Auto A/B</button>
          <button type="button" class="chip" data-variant="A" aria-pressed="false">A</button>
          <button type="button" class="chip" data-variant="B" aria-pressed="false">B</button>
        </div>
        <span class="komp-status" id="komp-status"></span>
      </div>

      <p class="chord-line" id="chord-line" hidden></p>

      <div class="transport">
        <button type="button" id="btn-play" disabled aria-label="Spela" title="Spela (mellanslag)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" id="btn-pause" class="secondary" disabled aria-label="Paus" title="Paus (mellanslag)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button type="button" id="btn-stop" class="secondary" disabled aria-label="Stopp" title="Stopp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>

      <div class="lane" id="lane" aria-label="Rörlig tidslinje, nästa 8 takter">
        <div class="lane-track" id="lane-track"></div>
        <canvas class="lane-roll" id="lane-roll" aria-hidden="true"></canvas>
        <div class="lane-pinned" id="lane-pinned" hidden></div>
      </div>

      <div class="timeline-block">
        <div class="timeline overview" id="timeline" role="slider" aria-label="Tidslinje" tabindex="0">
          <div class="timeline-rail" id="timeline-rail">
            <div class="timeline-sections" id="timeline-sections"></div>
            <div class="timeline-notes" id="timeline-notes"></div>
            <div class="timeline-playhead" id="timeline-playhead"></div>
          </div>
        </div>
        <div class="time-row">
          <span id="time-barbeat">takt 1 slag 1</span>
          <span id="time-elapsed">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="speed-row" role="group" aria-label="Hastighet">
        <span class="speed-label">Hastighet</span>
        <div class="speed-options" id="speed-options"></div>
      </div>

      <div class="notes-panel">
        <div class="notes-toolbar">
          <div class="note-add" id="note-add" role="group" aria-label="Ny anteckning vid aktuell position">
            <button type="button" data-type="bug" class="note-add-btn type-bug">+ Fel <kbd>B</kbd></button>
            <button type="button" data-type="onske" class="note-add-btn type-onske">+ Önskemål <kbd>Ö</kbd><kbd>W</kbd></button>
            <button type="button" data-type="note" class="note-add-btn type-note">+ Anteckning <kbd>N</kbd></button>
          </div>
          <div class="notes-actions">
            <button type="button" id="btn-copy-notes" class="ghost">Kopiera till urklipp</button>
            <button type="button" id="btn-clear-notes" class="ghost danger">Rensa</button>
          </div>
        </div>
        <ul id="notes-list" class="notes-list"></ul>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <dialog id="note-dialog" class="note-dialog">
    <form method="dialog" id="note-form">
      <p class="dialog-title" id="note-dialog-title">Ny anteckning</p>
      <p class="dialog-meta" id="note-dialog-meta"></p>
      <textarea id="note-text" rows="3" placeholder="Beskriv för arrangörsboten…" required></textarea>
      <div class="dialog-actions">
        <button type="button" id="note-cancel" class="secondary">Avbryt</button>
        <button type="submit" value="save">Spara</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="player.js"></script>
</body>
</html>
